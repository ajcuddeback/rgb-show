# nginx reverse proxy in front of gunicorn.
#
#   sudo cp deploy/nginx-rgb-show.conf /etc/nginx/sites-available/rgb-show
#   sudo ln -sf /etc/nginx/sites-available/rgb-show /etc/nginx/sites-enabled/rgb-show
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # The service worker and its manifest must never be cached, or installed
    # apps won't see new deploys.
    location = /ngsw-worker.js { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; add_header Cache-Control "no-cache"; }
    location = /ngsw.json      { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; add_header Cache-Control "no-cache"; }

    # Hashed Angular bundles are safe to cache forever; index.html must not be.
    location ~* \.(js|css|svg|ico|png|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
}
