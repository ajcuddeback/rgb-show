# /etc/raspotify/conf — Spotify Connect receiver for the tree.
# Installed by setup.sh. librespot writes raw PCM (S16LE, 44.1 kHz, stereo) to a
# FIFO; the rgb-show server reads it, drives the music effects, and plays it out
# the speaker. That keeps lights and sound as one stream.

LIBRESPOT_NAME="Christmas Tree"
LIBRESPOT_DEVICE_TYPE="speaker"
LIBRESPOT_BITRATE="160"
LIBRESPOT_BACKEND="pipe"
LIBRESPOT_DEVICE="/var/lib/rgb-show/audio.fifo"
LIBRESPOT_FORMAT="S16"
LIBRESPOT_INITIAL_VOLUME="80"
LIBRESPOT_ENABLE_VOLUME_NORMALISATION=
LIBRESPOT_DISABLE_AUDIO_CACHE=
