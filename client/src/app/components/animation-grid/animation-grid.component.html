@for (group of svc.categories(); track group.name) {
  <section class="group">
    <h3>{{ group.name }}</h3>
    <div class="tiles">
      @for (def of group.items; track def.name) {
        <button type="button" class="tile" [class.playing]="isPlaying(def)" [class.selected]="isSelected(def)"
                (click)="play(def)" [attr.aria-pressed]="isPlaying(def)" [title]="def.description">
          <span class="art" [style.background]="art(def)">
            @if (isPlaying(def)) { <span class="playing-dot"></span> }
          </span>
          <span class="name">{{ def.label }}</span>
        </button>
      }
    </div>
  </section>
}
