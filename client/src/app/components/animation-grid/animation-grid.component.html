@for (group of svc.categories(); track group.name) {
  <section class="group">
    <h3>{{ group.name }}</h3>
    <ul>
      @for (def of group.items; track def.name) {
        <li [class.open]="isSelected(def)" [class.playing]="isPlaying(def)">
          <button type="button" class="row-btn" (click)="play(def)" [attr.aria-expanded]="isSelected(def)">
            <span class="dots" aria-hidden="true">
              @for (c of previewColors(def); track $index) { <span class="dot" [style.background]="c"></span> }
            </span>
            <span class="name">{{ def.label }}</span>
            @if (isPlaying(def)) { <span class="now muted small">playing</span> }
          </button>
          @if (isSelected(def)) {
            <div class="settings">
              <app-param-editor />
            </div>
          }
        </li>
      }
    </ul>
  </section>
}
